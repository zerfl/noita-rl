[project]
name = "noita-rl-bench"
version = "0.1.0"
description = "Driver for the Noita RL feasibility benchmark"
requires-python = ">=3.12"
dependencies = [
    "gymnasium>=1.3.0",
    "matplotlib>=3.11.2",
    "omegaconf>=2.3.1",
    "psutil>=5.9",
    "stable-baselines3>=2.9.0",
    "tensorboard>=2.21.0",
    "tensordict>=0.14.2",
    "torch>=2.11.0",
    "torchrl>=0.14.0",
]

[project.scripts]
rl-bench = "driver.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["driver"]

[tool.uv.sources]
torch = { index = "pytorch-cu128" }

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true
