[project]
name = "noita-rl-bench"
version = "0.1.0"
description = "Driver for the Noita RL feasibility benchmark"
requires-python = ">=3.12"
dependencies = ["psutil>=5.9"]

[project.scripts]
rl-bench = "driver.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["driver"]
